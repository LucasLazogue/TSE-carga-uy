name: Deploy tracking

on:
  push:
    branches: [release]
    paths:
      - 'nodo-tracking/**'
      - '.github/workflows/deploy-tracking.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tracking
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGEN: ghcr.io/lucaslazogue/tse-carga-uy/nodo-tracking
      # los nodos van en un proyecto distinto al del central (R15), con su propia cuenta de servicio
      OPENSHIFT_SERVER: https://api.rm2.thpm.p1.openshiftapps.com:6443
      OPENSHIFT_NAMESPACE: andres-murara-dev
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TRACKING_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: nodo-tracking
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nodo-tracking
          cache-to: type=gha,mode=max,scope=nodo-tracking
      # sin el secreto solo publica la imagen; con el, actualiza los dos nodos en OpenShift
      - if: env.OPENSHIFT_TOKEN == ''
        run: echo "::notice::Falta el secreto OPENSHIFT_TRACKING_TOKEN; se publico la imagen sin desplegar"
      - if: env.OPENSHIFT_TOKEN != ''
        uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4"
      # la cuenta de servicio solo puede ver y actualizar Deployments (openshift/despliegue-ci.yaml): sin oc project
      - if: env.OPENSHIFT_TOKEN != ''
        run: oc login --server="$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"
      - if: env.OPENSHIFT_TOKEN != ''
        run: |
          for nodo in nodo-tracking-1 nodo-tracking-2; do
            oc -n "$OPENSHIFT_NAMESPACE" set image "deployment/$nodo" nodo-tracking="$IMAGEN:${{ github.sha }}"
          done
      # un nodo solo queda listo con el broker conectado; con las replicas en 0 termina enseguida
      - if: env.OPENSHIFT_TOKEN != ''
        run: |
          for nodo in nodo-tracking-1 nodo-tracking-2; do
            oc -n "$OPENSHIFT_NAMESPACE" rollout status "deployment/$nodo" --timeout=10m
          done
