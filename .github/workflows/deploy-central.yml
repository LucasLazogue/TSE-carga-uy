name: Deploy central

on:
  push:
    branches: [release]
    paths:
      - 'carga-uy/**'
      - '.github/workflows/deploy-central.yml'
  workflow_dispatch:

concurrency:
  group: deploy-central
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGEN: ghcr.io/lucaslazogue/tse-carga-uy/carga-uy
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: carga-uy
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          # cachea las capas entre corridas: sin esto cada deploy vuelve a bajar todo maven
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4"
      - run: oc login --server="${{ vars.OPENSHIFT_SERVER }}" --token="${{ secrets.OPENSHIFT_TOKEN }}"
      - run: oc project "${{ vars.OPENSHIFT_NAMESPACE }}"
      - run: oc set image deployment/carga-uy carga-uy="$IMAGEN:${{ github.sha }}"
      - run: oc rollout status deployment/carga-uy --timeout=10m