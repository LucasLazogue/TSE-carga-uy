name: Deploy PDI

on:
  push:
    branches: [release]
    paths:
      - 'pdi-suplantador/**'
      - '.github/workflows/deploy-pdi.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pdi
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGEN: ghcr.io/lucaslazogue/tse-carga-uy/pdi-suplantador
      # el suplantador va en el proyecto de los nodos de tracking (sistema externo) y usa su cuenta de servicio
      OPENSHIFT_SERVER: https://api.rm2.thpm.p1.openshiftapps.com:6443
      OPENSHIFT_NAMESPACE: andres-murara-dev
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TRACKING_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: pdi-suplantador
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pdi-suplantador
          cache-to: type=gha,mode=max,scope=pdi-suplantador
      # sin el secreto solo publica la imagen; con el, actualiza el suplantador en OpenShift
      - if: env.OPENSHIFT_TOKEN == ''
        run: echo "::notice::Falta el secreto OPENSHIFT_TRACKING_TOKEN; se publico la imagen sin desplegar"
      - if: env.OPENSHIFT_TOKEN != ''
        uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4"
      # la cuenta de servicio de nodo-tracking/openshift/despliegue-ci.yaml solo ve y actualiza Deployments: sin oc project
      - if: env.OPENSHIFT_TOKEN != ''
        run: oc login --server="$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"
      - if: env.OPENSHIFT_TOKEN != ''
        run: oc -n "$OPENSHIFT_NAMESPACE" set image deployment/pdi-suplantador pdi-suplantador="$IMAGEN:${{ github.sha }}"
      # WildFly tarda en desplegar el servicio; con las replicas en 0 termina enseguida
      - if: env.OPENSHIFT_TOKEN != ''
        run: oc -n "$OPENSHIFT_NAMESPACE" rollout status deployment/pdi-suplantador --timeout=10m
