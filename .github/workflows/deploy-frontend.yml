name: Deploy frontend

on:
  push:
    branches: [release]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # compila en actions y vercel solo publica el resultado
      - run: npx vercel@65 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@65 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@65 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
