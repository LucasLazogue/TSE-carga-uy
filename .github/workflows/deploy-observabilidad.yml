name: Deploy observabilidad

on:
  push:
    branches: [release]
    paths:
      - 'carga-uy/observabilidad/**'
      - '.github/workflows/deploy-observabilidad.yml'
  workflow_dispatch:

concurrency:
  group: deploy-observabilidad
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGEN: ghcr.io/lucaslazogue/tse-carga-uy/observabilidad
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: carga-uy/observabilidad
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=observabilidad
          cache-to: type=gha,mode=max,scope=observabilidad
      # la plataforma va en el proyecto del central, con la misma cuenta de servicio que Deploy central
      - uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4"
      - run: oc login --server="${{ vars.OPENSHIFT_SERVER }}" --token="${{ secrets.OPENSHIFT_TOKEN }}"
      - run: oc project "${{ vars.OPENSHIFT_NAMESPACE }}"
      # el primer despliegue es a mano (carga-uy/openshift/observabilidad.yaml); hasta entonces solo publica la imagen
      - id: existe
        run: |
          if oc get deployment/observabilidad >/dev/null 2>&1; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Todavia no hay deployment/observabilidad; se publico la imagen sin desplegar"
          fi
      - if: steps.existe.outputs.si == 'true'
        run: oc set image deployment/observabilidad observabilidad="$IMAGEN:${{ github.sha }}"
      - if: steps.existe.outputs.si == 'true'
        run: oc rollout status deployment/observabilidad --timeout=10m
