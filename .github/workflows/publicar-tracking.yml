name: Publicar tracking

on:
  push:
    branches: [release]
    paths:
      - 'nodo-tracking/**'
      - '.github/workflows/publicar-tracking.yml'
  workflow_dispatch:

concurrency:
  group: publicar-tracking
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGEN: ghcr.io/lucaslazogue/tse-carga-uy/nodo-tracking
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: nodo-tracking
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nodo-tracking
          cache-to: type=gha,mode=max,scope=nodo-tracking
