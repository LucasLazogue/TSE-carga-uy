name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cambios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cambios: ${{ steps.filtro.outputs.changes }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      mobile: ${{ steps.filtro.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            carga-uy:
              - 'carga-uy/**'
              - '.github/workflows/**'
            carga-uy-client:
              - 'carga-uy-client/**'
              - 'carga-uy/**'
              - '.github/workflows/**'
            nodo-tracking:
              - 'nodo-tracking/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            mobile:
              - 'mobile/**'
              - '.github/workflows/**'

  backend:
    needs: cambios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [carga-uy, carga-uy-client, nodo-tracking]
        include:
          - module: carga-uy
            perfil: -Pci
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CAMBIOS: ${{ contains(fromJSON(needs.cambios.outputs.cambios), matrix.module) }}
    steps:
      - if: env.CAMBIOS == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: env.CAMBIOS == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 24
          cache: maven
      - if: env.CAMBIOS == 'true' && matrix.module == 'carga-uy-client'
        run: mvn -B install -DskipTests
        working-directory: carga-uy
      - if: env.CAMBIOS == 'true'
        run: mvn -B verify ${{ matrix.perfil }}
        working-directory: ${{ matrix.module }}
      - if: env.CAMBIOS == 'true' && matrix.module == 'carga-uy' && env.SONAR_TOKEN != ''
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/carga-uy/carga-uy-ear/target/site/jacoco-aggregate/jacoco.xml
        working-directory: carga-uy
      - if: always() && env.CAMBIOS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/**/target/surefire-reports/
            ${{ matrix.module }}/**/target/spotbugsXml.xml
            ${{ matrix.module }}/**/target/site/jacoco-aggregate/
          if-no-files-found: ignore

  frontend:
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  imagen:
    needs: cambios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        imagen: [carga-uy, nodo-tracking]
    env:
      CAMBIOS: ${{ contains(fromJSON(needs.cambios.outputs.cambios), matrix.imagen) }}
    steps:
      - if: env.CAMBIOS == 'true'
        uses: actions/checkout@v7
      - if: env.CAMBIOS == 'true'
        uses: docker/setup-buildx-action@v4
      - if: env.CAMBIOS == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.imagen }}
          push: false
          tags: ${{ matrix.imagen }}:ci
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  mobile:
    needs: cambios
    if: needs.cambios.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: mobile
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-mobile
          path: mobile/app/build/reports/
          if-no-files-found: ignore
