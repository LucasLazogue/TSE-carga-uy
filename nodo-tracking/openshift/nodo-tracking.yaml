# nodo de tracking en un proyecto de OpenShift distinto al del central (R15). Publica en el broker del
# central por la Route artemis-nodos (passthrough en el 443): TLS de punta a punta y el destino por SNI.
# No recibe conexiones, asi que no tiene Service ni Route. Los pasos estan en ../README.md#despliegue-en-openshift
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodo-tracking
spec:
  replicas: 1
  # dos pods simularian dos veces la misma flota (posiciones dobles por vehiculo): el viejo termina antes
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nodo-tracking
  template:
    metadata:
      labels:
        app: nodo-tracking
    spec:
      containers:
        - name: nodo-tracking
          image: ghcr.io/lucaslazogue/tse-carga-uy/nodo-tracking:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: TZ
              value: America/Montevideo
            - name: ARTEMIS_HOST
              value: artemis-nodos-kevin-martinez-herna-dev.apps.rm2.thpm.p1.openshiftapps.com
            - name: NODO_ID
              value: tracking-1
            - name: NODO_JMS_USUARIO
              value: tracking-1
            - name: NODO_JMS_CLAVE
              valueFrom:
                secretKeyRef:
                  name: nodo-tracking-secretos
                  key: NODO_JMS_CLAVE
            - name: NODO_TRUSTSTORE_CLAVE
              valueFrom:
                secretKeyRef:
                  name: nodo-tracking-secretos
                  key: NODO_TRUSTSTORE_CLAVE
            # $(VAR) lo expande Kubernetes con las variables de arriba; sniHost es obligatorio: sin el, el
            # router de OpenShift no sabe a que Route mandar la conexion
            - name: NODO_JMS_URL
              value: tcp://$(ARTEMIS_HOST):443?sslEnabled=true&sniHost=$(ARTEMIS_HOST)&trustStorePath=/secretos/confianza.p12&trustStorePassword=$(NODO_TRUSTSTORE_CLAVE)
            - name: NODO_RUTAS
              value: flotas/flota-sur.json
            # la frecuencia del volumen objetivo (AC08); el compose usa 10 s para desarrollo
            - name: NODO_INTERVALO_SEG
              value: "30"
            # hasta que haya Plataforma de Observabilidad en la nube: sin colector, el SDK llena el log de errores
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: nodo-tracking
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: nodo.id=tracking-1,service.instance.id=tracking-1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # /health da 503 mientras no hay conexion con el broker: el pod no queda listo pero no se reinicia,
          # porque el nodo guarda los eventos y reintenta solo
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 10
          volumeMounts:
            - name: secretos
              mountPath: /secretos
              readOnly: true
      volumes:
        - name: secretos
          secret:
            secretName: nodo-tracking-secretos
            items:
              - key: confianza.p12
                path: confianza.p12
