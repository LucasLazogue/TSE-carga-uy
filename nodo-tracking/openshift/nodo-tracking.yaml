            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            - name: OTEL_SERVICE_NAME
              value: nodo-tracking
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: nodo.id=tracking-2,service.instance.id=tracking-2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 10
          volumeMounts:
            - name: secretos
              mountPath: /secretos
              readOnly: true
      volumes:
        - name: secretos
          secret:
            secretName: nodo-tracking-secretos
            items:
              - key: confianza.p12
                path: confianza.p12
