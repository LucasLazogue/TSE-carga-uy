server {
    listen 80;
    root /usr/share/nginx/html;

    # la api va al central, como el proxy de Vite en desarrollo y los rewrites de Vercel
    location /api/ {
        proxy_pass http://carga-uy:8080/carga-uy/api/;
    }

    # las rutas de React Router no son archivos: devuelven la aplicacion
    location / {
        try_files $uri /index.html;
    }
}
