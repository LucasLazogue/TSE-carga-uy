apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: balanzas-sur
spec:
  to:
    kind: Service
    name: cargauy-balanzas-sur
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cargauy-balanzas-norte
spec:
  to:
    kind: Service
    name: cargauy-balanzas-norte
  port:
    # el puerto se llama igual en los dos Services (nodo-balanzas.yaml)
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: None
