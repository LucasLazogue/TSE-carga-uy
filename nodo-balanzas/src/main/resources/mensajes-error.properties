PESAJE_FECHA_REQUERIDA=Debe indicar la fecha de los pesajes (AAAA-MM-DD).
PESAJE_MATRICULA_O_RUT=Debe indicar la matricula o el rut de la empresa, uno de los dos.

PEAJE_CODIGO_REQUERIDO=El codigo del peaje es obligatorio.
PEAJE_NOMBRE_REQUERIDO=El nombre del peaje es obligatorio.
PEAJE_RUTA_REQUERIDA=La ruta del peaje es obligatoria.
PEAJE_KM_INVALIDO=El km del peaje no puede ser negativo.
PEAJE_CODIGO_DUPLICADO=Ya existe un peaje con el codigo {0}.
PEAJE_NO_ENCONTRADO=No existe un peaje con el codigo {0}.

BALANZA_CODIGO_REQUERIDO=El codigo de la balanza es obligatorio.
BALANZA_SENTIDO_REQUERIDO=Debe indicar el sentido de la balanza (HACIA_MONTEVIDEO o HACIA_EL_INTERIOR).
BALANZA_CLAVE_CORTA=La clave de la balanza debe tener al menos {0} caracteres.
BALANZA_CODIGO_DUPLICADO=Ya existe una balanza con el codigo {0}.
BALANZA_CLAVE_EN_USO=Esa clave ya la usa otra balanza.

AUTH_CLAVE_INVALIDA=Falta la clave de acceso o no es valida.
ACCESO_DENEGADO=No tiene permisos para realizar esta accion.
