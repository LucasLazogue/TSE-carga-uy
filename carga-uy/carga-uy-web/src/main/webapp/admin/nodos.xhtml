<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/backoffice.xhtml">

    <ui:define name="titulo">Nodos periféricos</ui:define>

    <ui:define name="contenido">
        <h:form id="nodos">
            <p:toolbar styleClass="mb-3">
                <p:toolbarGroup>
                    <p:commandButton value="Registrar nodo" icon="pi pi-plus" action="#{nodoView.nuevo}"
                                     process="@this" update=":registro" resetValues="true"
                                     oncomplete="PF('registro').show()" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="tabla" value="#{nodoView.nodos}" var="nodo" rowKey="#{nodo.id}"
                         emptyMessage="No hay nodos registrados.">
                <p:column headerText="Identificador">#{nodo.identificador}</p:column>
                <p:column headerText="Tipo">#{nodo.tipo}</p:column>
                <p:column headerText="Punto de acceso">
                    <div class="flex gap-2">
                        <p:inputText id="puntoAcceso" value="#{nodo.puntoAcceso}" styleClass="flex-1" />
                        <p:commandButton icon="pi pi-check" title="Cambiar punto de acceso"
                                         action="#{nodoView.cambiarPuntoAcceso(nodo)}"
                                         process="@this puntoAcceso" update="@form"
                                         styleClass="ui-button-outlined" />
                    </div>
                </p:column>
                <p:column headerText="Clave">
                    <h:panelGroup styleClass="flex gap-2" layout="block" rendered="#{nodo.tipo == 'BALANZAS'}">
                        <p:password id="clave" value="#{nodo.clave}" placeholder="Nueva clave" styleClass="flex-1"
                                    inputStyleClass="w-full" redisplay="false" />
                        <p:commandButton icon="pi pi-key" title="Cambiar clave"
                                         action="#{nodoView.cambiarClave(nodo)}"
                                         process="@this clave" update="@form"
                                         styleClass="ui-button-outlined" />
                    </h:panelGroup>
                </p:column>
                <p:column headerText="Estado">
                    <p:tag value="#{nodo.estado}" severity="#{nodoView.habilitado(nodo) ? 'success' : 'warning'}" />
                </p:column>
                <p:column headerText="Acciones">
                    <div class="flex gap-2">
                        <p:commandButton value="Habilitar" icon="pi pi-play" action="#{nodoView.habilitar(nodo)}"
                                         rendered="#{not nodoView.habilitado(nodo)}" process="@this" update="@form"
                                         styleClass="ui-button-outlined" />
                        <p:commandButton value="Deshabilitar" icon="pi pi-pause" action="#{nodoView.deshabilitar(nodo)}"
                                         rendered="#{nodoView.habilitado(nodo)}" process="@this" update="@form"
                                         styleClass="ui-button-outlined ui-button-secondary" />
                        <p:commandButton icon="pi pi-trash" title="Dar de baja" action="#{nodoView.darDeBaja(nodo)}"
                                         process="@this" update="@form"
                                         styleClass="ui-button-outlined ui-button-danger">
                            <p:confirm header="Dar de baja" message="¿Dar de baja el nodo #{nodo.identificador}?"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </div>
                </p:column>
            </p:dataTable>
        </h:form>

        <p:dialog header="Registrar nodo" widgetVar="registro" modal="true" resizable="false"
                  responsive="true" width="30rem">
            <h:form id="registro">
                <div class="field">
                    <p:outputLabel for="identificador" value="Identificador" styleClass="block mb-2" />
                    <p:inputText id="identificador" value="#{nodoView.nodo.identificador}" required="true"
                                 requiredMessage="El identificador del nodo es obligatorio." styleClass="w-full" />
                </div>
                <div class="field">
                    <p:outputLabel for="tipo" value="Tipo" styleClass="block mb-2" />
                    <p:selectOneMenu id="tipo" value="#{nodoView.nodo.tipo}" required="true"
                                     requiredMessage="Debe indicar el tipo de nodo (BALANZAS o TRACKING)."
                                     styleClass="w-full">
                        <f:selectItem itemLabel="Seleccione un tipo" noSelectionOption="true" />
                        <f:selectItems value="#{nodoView.tipos}" />
                        <p:ajax process="@this" update="claveNodo" />
                    </p:selectOneMenu>
                </div>
                <div class="field">
                    <p:outputLabel for="puntoAcceso" value="Punto de acceso" styleClass="block mb-2" />
                    <p:inputText id="puntoAcceso" value="#{nodoView.nodo.puntoAcceso}" placeholder="https://..."
                                 styleClass="w-full" />
                </div>
                <h:panelGroup id="claveNodo" layout="block">
                    <h:panelGroup styleClass="field" layout="block" rendered="#{nodoView.nodo.tipo == 'BALANZAS'}">
                        <p:outputLabel for="claveNueva" value="Clave del nodo" styleClass="block mb-2" />
                        <p:password id="claveNueva" value="#{nodoView.nodo.clave}" required="true"
                                    requiredMessage="Debe indicar la clave con la que el central consulta al nodo de balanzas."
                                    styleClass="w-full" inputStyleClass="w-full" redisplay="false" />
                    </h:panelGroup>
                </h:panelGroup>
                <div class="flex justify-content-end gap-2">
                    <p:commandButton value="Cancelar" type="button" onclick="PF('registro').hide()"
                                     styleClass="ui-button-secondary ui-button-flat" />
                    <p:commandButton value="Guardar" icon="pi pi-check" action="#{nodoView.createNodo}"
                                     update="@form :nodos"
                                     oncomplete="if (args &amp;&amp; !args.validationFailed) PF('registro').hide()" />
                </div>
            </h:form>
        </p:dialog>
    </ui:define>

</ui:composition>
