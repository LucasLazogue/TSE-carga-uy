<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/simple.xhtml">

    <ui:define name="titulo">Página desactualizada</ui:define>

    <ui:define name="contenido">
        <p class="mt-0 mb-4">No se pudo procesar la última acción porque la página quedó desactualizada.
            Lo que no se había guardado se perdió.</p>
        <p:linkButton value="Ir al inicio" icon="pi pi-home" outcome="#{vistaExpiradaView.destino}"
                      rendered="#{vistaExpiradaView.conSesion}" />
        <p:linkButton value="Ingresar" icon="pi pi-sign-in" outcome="/login"
                      rendered="#{not vistaExpiradaView.conSesion}" />
    </ui:define>

</ui:composition>
