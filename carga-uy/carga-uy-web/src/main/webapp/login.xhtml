<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/simple.xhtml">

    <ui:define name="titulo">Ingresar</ui:define>

    <ui:define name="contenido">
        <h:form id="login">
            <p:messages id="mensajes" closable="true" />

            <div class="field">
                <p:outputLabel for="usuario" value="Usuario" styleClass="block mb-2" />
                <p:inputText id="usuario" value="#{loginView.usuario}" required="true"
                             requiredMessage="El usuario es obligatorio."
                             autocomplete="username" styleClass="w-full" />
            </div>

            <div class="field">
                <p:outputLabel for="clave" value="Clave" styleClass="block mb-2" />
                <p:password id="clave" value="#{loginView.clave}" required="true"
                            requiredMessage="La clave es obligatoria." feedback="false"
                            autocomplete="current-password" styleClass="w-full" inputStyleClass="w-full" />
            </div>

            <p:commandButton value="Ingresar" icon="pi pi-sign-in" action="#{loginView.ingresar}"
                             update="@form" styleClass="w-full mt-2" />
        </h:form>
    </ui:define>

</ui:composition>
