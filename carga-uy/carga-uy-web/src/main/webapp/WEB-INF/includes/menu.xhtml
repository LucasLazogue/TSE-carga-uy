<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <nav class="w-16rem flex-shrink-0 p-3">
        <p:menu styleClass="w-full">
            <p:submenu label="Administración" rendered="#{request.isUserInRole('ADMINISTRADOR')}">
                <p:menuitem value="Usuarios" icon="pi pi-users" outcome="/admin/usuarios"
                            styleClass="#{view.viewId eq '/admin/usuarios.xhtml' ? 'ui-state-active' : ''}" />
                <p:menuitem value="Nodos periféricos" icon="pi pi-server" outcome="/admin/nodos"
                            styleClass="#{view.viewId eq '/admin/nodos.xhtml' ? 'ui-state-active' : ''}" />
                <p:menuitem value="Reglas de fiscalización" icon="pi pi-sliders-h" outcome="/admin/reglas"
                            styleClass="#{view.viewId eq '/admin/reglas.xhtml' ? 'ui-state-active' : ''}" />
            </p:submenu>
            <p:submenu label="Autoridad" rendered="#{request.isUserInRole('AUTORIDAD')}">
                <p:menuitem value="Reportes" icon="pi pi-chart-bar" outcome="/autoridad/reportes"
                            styleClass="#{view.viewId eq '/autoridad/reportes.xhtml' ? 'ui-state-active' : ''}" />
                <p:menuitem value="Mis exportaciones" icon="pi pi-download" outcome="/autoridad/exportaciones"
                            styleClass="#{view.viewId eq '/autoridad/exportaciones.xhtml' ? 'ui-state-active' : ''}" />
            </p:submenu>
        </p:menu>
    </nav>
</ui:composition>
