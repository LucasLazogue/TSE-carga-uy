services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cargauy
      POSTGRES_USER: cargauy
      POSTGRES_PASSWORD: cargauy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  carga-uy:
    build: .
    hostname: localhost
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      GUBUY_MOCK: ${GUBUY_MOCK:-true}
      CARGAUY_JWT_SECRET: ${CARGAUY_JWT_SECRET:-secreto-local-solo-para-desarrollo}
      CARGAUY_MOBILE_REDIRECT: ${CARGAUY_MOBILE_REDIRECT:-cargauy://ingreso}
      GUBUY_URL: ${GUBUY_URL:-https://auth-testing.iduruguay.gub.uy/oidc/v1}
      GUBUY_CLIENT_ID: ${GUBUY_CLIENT_ID:-}
      GUBUY_CLIENT_SECRET: ${GUBUY_CLIENT_SECRET:-}
      GUBUY_REDIRECT_URI: ${GUBUY_REDIRECT_URI:-http://localhost:8080/carga-uy/api/auth/callback}
      CARGAUY_FRONTEND_URL: ${CARGAUY_FRONTEND_URL:-http://localhost:5173}

volumes:
  pgdata:
