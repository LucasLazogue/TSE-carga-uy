services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cargauy
      POSTGRES_USER: cargauy
      POSTGRES_PASSWORD: cargauy
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
    command: ["postgres", "-c", "timezone=${CARGAUY_ZONA_HORARIA:-America/Montevideo}", "-c", "log_timezone=${CARGAUY_ZONA_HORARIA:-America/Montevideo}"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Almacen de Posiciones (DA07, opcional 10)
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: cargauy
      MONGO_INITDB_ROOT_PASSWORD: cargauy
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db

  # broker de mensajeria (DA02): en su propio contenedor, compartido por todas las instancias del central.
  # 8161 es la consola (usuario artemis, clave artemis), 61617 la entrada con TLS para los nodos perifericos
  artemis:
    build: ./artemis
    environment:
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
    ports:
      - "8161:8161"
      - "61617:61617"
    volumes:
      - artemisdata:/var/lib/artemis-instance

  # Directorio LDAP
  ldap:
    image: 389ds/dirsrv:3.1
    environment:
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
      DS_DM_PASSWORD: ${LDAP_DM_PASSWORD:-cargauy123}
      DS_SUFFIX_NAME: dc=carga,dc=uy
      LDAP_ADMIN_USUARIO: ${LDAP_ADMIN_USUARIO:-}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-}
    ports:
      - "1389:3389"
    volumes:
      - ldapdata:/data
      - ./ldap/directorio.ldif:/directorio.ldif:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:3389 -D 'cn=Directory Manager' -w \"$$DS_DM_PASSWORD\" -b '' -s base > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
    post_start:
      - command:
          - sh
          - -c
          - |
            set -e
            until ldapsearch -x -H ldap://localhost:3389 -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" -b "" -s base > /dev/null 2>&1; do
              sleep 2
            done
            dsconf -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" ldap://localhost:3389 backend suffix list | grep -q "^dc=carga,dc=uy " \
              || dsconf -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" ldap://localhost:3389 backend create --suffix dc=carga,dc=uy --be-name carga --create-suffix
            dsconf -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" ldap://localhost:3389 pwpolicy set --pwdlockout on --pwdmaxfailures 5 --pwdlockoutduration 900
            ldapadd -c -x -H ldap://localhost:3389 -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" -f /directorio.ldif || [ $$? -eq 68 ]
            admin="uid=$$LDAP_ADMIN_USUARIO,ou=usuarios,dc=carga,dc=uy"
            if [ -n "$$LDAP_ADMIN_USUARIO" ] && ! ldapsearch -x -H ldap://localhost:3389 -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" -b "$$admin" -s base > /dev/null 2>&1; then
              ldapadd -x -H ldap://localhost:3389 -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" <<FIN
            dn: $$admin
            objectClass: inetOrgPerson
            uid: $$LDAP_ADMIN_USUARIO
            cn: $$LDAP_ADMIN_USUARIO
            sn: $$LDAP_ADMIN_USUARIO
            userPassword: $$LDAP_ADMIN_PASSWORD

            dn: cn=administrador,ou=grupos,dc=carga,dc=uy
            changetype: modify
            add: member
            member: $$admin
            FIN
            fi
            # indice para paginar el listado de usuarios ordenado por uid sin recorrer todo el directorio
            if ! dsconf -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" ldap://localhost:3389 backend vlv-index list carga | grep -q "^cn: usuarios$$"; then
              dsconf -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" ldap://localhost:3389 backend vlv-index add-search --name usuarios --search-base ou=usuarios,dc=carga,dc=uy --search-scope 1 --search-filter "(objectClass=inetOrgPerson)" carga
              dsconf -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" ldap://localhost:3389 backend vlv-index add-index --parent-name usuarios --index-name usuarios-uid --sort uid carga
              dsconf -D "cn=Directory Manager" -w "$$DS_DM_PASSWORD" ldap://localhost:3389 backend vlv-index reindex --parent-name usuarios carga
            fi

  # Plataforma de Observabilidad (AC21 a AC24): colector OpenTelemetry, Prometheus, Tempo, Loki y Grafana.
  # Grafana en http://localhost:3000 (sin usuario); 4317 y 4318 reciben OTLP desde el host
  observabilidad:
    build: ./observabilidad
    environment:
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  carga-uy:
    build: .
    hostname: localhost
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      # la JVM toma TZ como zona por defecto: la usan LocalDate.now() y la hora de los logs
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
      GUBUY_URL: ${GUBUY_URL:-https://auth-testing.iduruguay.gub.uy/oidc/v1}
      GUBUY_CLIENT_ID: ${GUBUY_CLIENT_ID:-}
      GUBUY_CLIENT_SECRET: ${GUBUY_CLIENT_SECRET:-}
      GUBUY_MOCK: ${GUBUY_MOCK:-false} # TODO mock
      GUBUY_REDIRECT_URI: ${GUBUY_REDIRECT_URI:-http://localhost:8080/carga-uy/api/auth/callback}
      CARGAUY_FRONTEND_URL: ${CARGAUY_FRONTEND_URL:-http://localhost:5173}
      CARGAUY_API_URL: ${CARGAUY_API_URL:-}
      CARGAUY_MOBILE_REDIRECT: ${CARGAUY_MOBILE_REDIRECT:-cargauy://ingreso}
      CARGAUY_JWT_SECRET: ${CARGAUY_JWT_SECRET:-secreto-local-solo-para-desarrollo}
      MONGO_URI: ${MONGO_URI:-mongodb://cargauy:cargauy@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-cargauy}
      ARTEMIS_HOST: ${ARTEMIS_HOST:-artemis}
      ARTEMIS_PORT: ${ARTEMIS_PORT:-61616}
      ARTEMIS_USUARIO: ${ARTEMIS_USUARIO:-central}
      ARTEMIS_CLAVE: ${ARTEMIS_CLAVE:-central123}
      LDAP_URL: ${LDAP_URL:-ldap://ldap:3389}
      LDAP_DM_PASSWORD: ${LDAP_DM_PASSWORD:-cargauy123}
      # trazas, metricas y logs hacia la Plataforma de Observabilidad; la proporcion de trazas que se guardan tiene
      # que ser la misma que en el nodo
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://observabilidad:4317}
      OTEL_ENDPOINT_METRICAS: ${OTEL_ENDPOINT_METRICAS:-http://observabilidad:4318/v1/metrics}
      OTEL_PROPORCION_TRAZAS: ${OTEL_PROPORCION_TRAZAS:-1.0}
    depends_on:
      - mongo
      - artemis
      - ldap

  # nodo periferico de tracking: simula la flota y publica sus posiciones en queue_tracking.
  # en el despliegue va en otra PaaS; aca esta para levantar todo con un solo comando
  nodo-tracking:
    build: ../nodo-tracking
    ports:
      - "8081:8081"
    environment:
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
      NODO_ID: ${NODO_ID:-tracking-1}
      # directo al broker, con TLS (R8), con el usuario del nodo, que solo puede publicar
      NODO_JMS_URL: ${NODO_JMS_URL:-tcp://artemis:61617?sslEnabled=true&trustStorePath=tls/confianza.p12&trustStorePassword=cargauy-dev}
      NODO_JMS_USUARIO: ${NODO_JMS_USUARIO:-tracking-1}
      NODO_JMS_CLAVE: ${NODO_JMS_CLAVE:-tracking123}
      NODO_INTERVALO_SEG: ${NODO_INTERVALO_SEG:-10}
      NODO_ACELERAR: ${NODO_ACELERAR:-1}
      NODO_VEHICULOS_EXTRA: ${NODO_VEHICULOS_EXTRA:-0}
      NODO_DUPLICADOS: ${NODO_DUPLICADOS:-0}
      NODO_DESORDENAR: ${NODO_DESORDENAR:-false}
      NODO_SIN_COBERTURA: ${NODO_SIN_COBERTURA:-}
      NODO_LOG_METRICAS_SEG: ${NODO_LOG_METRICAS_SEG:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://observabilidad:4318}
      OTEL_TRACES_SAMPLER: traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_PROPORCION_TRAZAS:-1.0}
      OTEL_METRIC_EXPORT_INTERVAL: 10000
      OTEL_RESOURCE_ATTRIBUTES: nodo.id=${NODO_ID:-tracking-1}
    # publica en el broker aunque el central no este: las posiciones esperan en la cola
    depends_on:
      - artemis

volumes:
  pgdata:
  mongodata:
  artemisdata:
  ldapdata:
