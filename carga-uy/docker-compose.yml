services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cargauy
      POSTGRES_USER: cargauy
      POSTGRES_PASSWORD: cargauy
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
    command: ["postgres", "-c", "timezone=${CARGAUY_ZONA_HORARIA:-America/Montevideo}", "-c", "log_timezone=${CARGAUY_ZONA_HORARIA:-America/Montevideo}"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Almacen de Posiciones (DA07, opcional 10)
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: cargauy
      MONGO_INITDB_ROOT_PASSWORD: cargauy
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db

  # broker de mensajeria (DA02): en su propio contenedor, compartido por todas las instancias del central.
  # 8161 es la consola (usuario artemis, clave artemis), 61617 la entrada con TLS para los nodos perifericos
  artemis:
    build: ./artemis
    environment:
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
    ports:
      - "8161:8161"
      - "61617:61617"
    volumes:
      - artemisdata:/var/lib/artemis-instance

  carga-uy:
    build: .
    hostname: localhost
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      # la JVM toma TZ como zona por defecto: la usan LocalDate.now() y la hora de los logs
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
      GUBUY_URL: ${GUBUY_URL:-https://auth-testing.iduruguay.gub.uy/oidc/v1}
      GUBUY_CLIENT_ID: ${GUBUY_CLIENT_ID:-}
      GUBUY_CLIENT_SECRET: ${GUBUY_CLIENT_SECRET:-}
      GUBUY_MOCK: ${GUBUY_MOCK:-false} # TODO mock
      GUBUY_REDIRECT_URI: ${GUBUY_REDIRECT_URI:-http://localhost:8080/carga-uy/api/auth/callback}
      CARGAUY_FRONTEND_URL: ${CARGAUY_FRONTEND_URL:-http://localhost:5173}
      CARGAUY_MOBILE_REDIRECT: ${CARGAUY_MOBILE_REDIRECT:-cargauy://ingreso}
      CARGAUY_JWT_SECRET: ${CARGAUY_JWT_SECRET:-secreto-local-solo-para-desarrollo}
      MONGO_URI: ${MONGO_URI:-mongodb://cargauy:cargauy@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-cargauy}
      ARTEMIS_HOST: ${ARTEMIS_HOST:-artemis}
      ARTEMIS_PORT: ${ARTEMIS_PORT:-61616}
      ARTEMIS_USUARIO: ${ARTEMIS_USUARIO:-central}
      ARTEMIS_CLAVE: ${ARTEMIS_CLAVE:-central123}
    depends_on:
      - mongo
      - artemis

  # nodo periferico de tracking: simula la flota y publica sus posiciones en queue_tracking.
  # en el despliegue va en otra PaaS; aca esta para levantar todo con un solo comando
  nodo-tracking:
    build: ../nodo-tracking
    ports:
      - "8081:8081"
    environment:
      TZ: ${CARGAUY_ZONA_HORARIA:-America/Montevideo}
      NODO_ID: ${NODO_ID:-tracking-1}
      # directo al broker, con TLS (R8), con el usuario del nodo, que solo puede publicar
      NODO_JMS_URL: ${NODO_JMS_URL:-tcp://artemis:61617?sslEnabled=true&trustStorePath=tls/confianza.p12&trustStorePassword=cargauy-dev}
      NODO_JMS_USUARIO: ${NODO_JMS_USUARIO:-tracking-1}
      NODO_JMS_CLAVE: ${NODO_JMS_CLAVE:-tracking123}
      NODO_INTERVALO_SEG: ${NODO_INTERVALO_SEG:-10}
      NODO_ACELERAR: ${NODO_ACELERAR:-1}
      NODO_VEHICULOS_EXTRA: ${NODO_VEHICULOS_EXTRA:-0}
      NODO_DUPLICADOS: ${NODO_DUPLICADOS:-0}
      NODO_DESORDENAR: ${NODO_DESORDENAR:-false}
      NODO_SIN_COBERTURA: ${NODO_SIN_COBERTURA:-}
      NODO_LOG_METRICAS_SEG: ${NODO_LOG_METRICAS_SEG:-60}
    # publica en el broker aunque el central no este: las posiciones esperan en la cola
    depends_on:
      - artemis

volumes:
  pgdata:
  mongodata:
  artemisdata:
