apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga-uy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carga-uy
  template:
    metadata:
      labels:
        app: carga-uy
    spec:
      containers:
        - name: carga-uy
          image: ghcr.io/lucaslazogue/tse-carga-uy/carga-uy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: carga-uy-config
            - secretRef:
                name: carga-uy-secretos
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # el health de WildFly (puerto de administracion) no depende de Mongo, que en la fase 1 no esta
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9990
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: carga-uy
spec:
  selector:
    app: carga-uy
  ports:
    - name: http
      port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: carga-uy
spec:
  to:
    kind: Service
    name: carga-uy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect