apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga-uy
spec:
  # sin replicas: las maneja el HorizontalPodAutoscaler de abajo. Si se fijaran aca, cada oc apply las pisaria
  selector:
    matchLabels:
      app: carga-uy
  template:
    metadata:
      labels:
        app: carga-uy
    spec:
      containers:
        - name: carga-uy
          image: ghcr.io/lucaslazogue/tse-carga-uy/carga-uy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: carga-uy-config
            - secretRef:
                name: carga-uy-secretos
            # elenco de la demo (ElencoDemo): cedulas de las cuentas de gub.uy y nodos con sus claves. Optativo: sin
            # el Secret el central arranca igual. Ver "Datos del central" en docs/infraestructura.md
            - secretRef:
                name: carga-uy-demo
                optional: true
          env:
            # cada instancia se identifica en las metricas con el nombre de su pod (etiqueta instance en Prometheus).
            # sin esto todas exportan con las mismas etiquetas y sus series se pisan: con el autoescalado, los contadores
            # y el uso del pool de cada instancia se mezclan
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=$(POD_NAME)
            # clave del estado de las pantallas del backoffice, la misma en todas las instancias. el Secret se crea antes
            # de aplicar este manifiesto: si falta, la instancia nueva no arranca y la anterior sigue atendiendo
            - name: CARGAUY_CLAVE_VISTAS
              valueFrom:
                secretKeyRef:
                  name: carga-uy-vistas
                  key: CARGAUY_CLAVE_VISTAS
          # el autoescalado mide el uso de CPU contra el request. Cuota del proyecto: 3 CPU de requests; Artemis,
          # Mongo, LDAP, Postgres y la plataforma de observabilidad piden ~0,5. Con 400m entran 4 instancias mas la
          # extra que agrega un despliegue (maxSurge)
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # el health de WildFly (puerto de administracion) no depende de Mongo, que en la fase 1 no esta
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9990
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: carga-uy
spec:
  selector:
    app: carga-uy
  ports:
    - name: http
      port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: carga-uy
  annotations:
    # sin afinidad: el login es un JWT y el estado de cada pantalla del backoffice viaja en la pagina, asi que
    # cualquier instancia atiende cualquier pedido. sin esto el router pone una cookie y deja a cada usuario en una
    # instancia
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  to:
    kind: Service
    name: carga-uy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# autoescalado del central (opcional 4): entre 1 y 4 instancias segun el uso de CPU. Todas consumen de la misma cola
# de tracking (cada mensaje lo procesa una sola) y no guardan estado propio ni de la API ni del backoffice. Ver "Varias instancias y autoescalado" en docs/infraestructura.md
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carga-uy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carga-uy
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # WildFly tarda ~1 minuto en arrancar: mientras tanto la cola absorbe el pico
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    # baja de a una instancia, despues de 5 minutos tranquilos, para no oscilar
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
