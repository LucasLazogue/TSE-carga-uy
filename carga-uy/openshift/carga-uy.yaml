apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga-uy
spec:
  # sin replicas: las maneja el HorizontalPodAutoscaler de abajo. Si se fijaran aca, cada oc apply las pisaria
  selector:
    matchLabels:
      app: carga-uy
  template:
    metadata:
      labels:
        app: carga-uy
    spec:
      containers:
        - name: carga-uy
          image: ghcr.io/lucaslazogue/tse-carga-uy/carga-uy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: carga-uy-config
            - secretRef:
                name: carga-uy-secretos
          # el autoescalado mide el uso de CPU contra el request. Cuota del proyecto: 3 CPU de requests; Artemis,
          # Mongo, LDAP, Postgres y la plataforma de observabilidad piden ~0,5. Con 400m entran 4 instancias mas la
          # extra que agrega un despliegue (maxSurge)
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # el health de WildFly (puerto de administracion) no depende de Mongo, que en la fase 1 no esta
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9990
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: carga-uy
spec:
  selector:
    app: carga-uy
  ports:
    - name: http
      port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: carga-uy
  annotations:
    # afinidad: el backoffice (JSF) guarda el estado de cada pantalla en la instancia que la abrio; el login es un JWT
    # y no depende de la instancia. El router de OpenShift ya da afinidad con una cookie; aca se le pone nombre
    router.openshift.io/cookie_name: carga-uy-instancia
spec:
  to:
    kind: Service
    name: carga-uy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# autoescalado del central (opcional 4): entre 1 y 4 instancias segun el uso de CPU. Todas consumen de la misma cola
# de tracking (cada mensaje lo procesa una sola) y no guardan estado propio de la API. Ver "Varias instancias y autoescalado" en docs/infraestructura.md
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carga-uy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carga-uy
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # WildFly tarda ~1 minuto en arrancar: mientras tanto la cola absorbe el pico
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    # baja de a una instancia, despues de 5 minutos tranquilos, para no oscilar
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
