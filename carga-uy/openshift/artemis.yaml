# Broker de tracking (Apache Artemis, DA02) en OpenShift. Reconstruido de lo que esta aplicado en el proyecto del
# central (oc apply view-last-applied), mas el puerto de la consola que lee el central para las metricas de la cola.
#
# La imagen se construye en el cluster desde carga-uy/artemis (BuildConfig e ImageStream de abajo):
#   oc apply -f openshift/artemis.yaml
#   oc start-build artemis --from-dir=artemis --follow
#
# Secret artemis-secretos (fuera del repositorio):
#   oc create secret generic artemis-secretos \
#     --from-literal=ARTEMIS_CLAVE_KEYSTORE=CLAVE_DEL_KEYSTORE \
#     --from-file=artemis.p12=RUTA_AL_KEYSTORE \
#     --from-file=artemis-users.properties=RUTA_A_LOS_USUARIOS
# artemis-users.properties tiene los usuarios del broker con sus claves de OpenShift (las del repositorio son de
# desarrollo): artemis (consola), central y uno por nodo de tracking. La clave de artemis va tambien en
# carga-uy-secretos como ARTEMIS_CONSOLA_CLAVE, y la de central como ARTEMIS_CLAVE.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: artemis
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: artemis
spec:
  # build binario: oc start-build --from-dir sube carga-uy/artemis y lo construye con su Dockerfile
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: artemis:latest
  runPolicy: Serial
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artemis-datos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis
spec:
  replicas: 1
  # el volumen es ReadWriteOnce: el pod viejo tiene que soltarlo antes de que arranque el nuevo
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: artemis
  template:
    metadata:
      labels:
        app: artemis
    spec:
      hostname: artemis
      containers:
        - name: artemis
          image: image-registry.openshift-image-registry.svc:5000/kevin-martinez-herna-dev/artemis:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: America/Montevideo
            - name: ARTEMIS_CLAVE_KEYSTORE
              valueFrom:
                secretKeyRef:
                  name: artemis-secretos
                  key: ARTEMIS_CLAVE_KEYSTORE
          ports:
            # instancias del central
            - containerPort: 61616
            # nodos de tracking de otros proyectos, con TLS (Route artemis-nodos)
            - containerPort: 61617
            # consola: el central lee por aca el tamano de la cola (MetricasCola)
            - containerPort: 8161
          readinessProbe:
            tcpSocket:
              port: 61617
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2560Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/artemis-instance
            # los usuarios y el keystore de OpenShift reemplazan a los de desarrollo que trae la imagen
            - name: secretos
              mountPath: /opt/carga-uy/etc/artemis-users.properties
              subPath: artemis-users.properties
            - name: secretos
              mountPath: /opt/carga-uy/etc/artemis.p12
              subPath: artemis.p12
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: artemis-datos
        - name: secretos
          secret:
            secretName: artemis-secretos
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
spec:
  selector:
    app: artemis
  ports:
    - name: central
      port: 61616
    - name: nodos
      port: 61617
    # solo dentro del proyecto: sin Route
    - name: consola
      port: 8161
---
# los nodos de tracking estan en otro proyecto: llegan al broker por aca, con TLS de punta a punta (passthrough)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: artemis-nodos
spec:
  to:
    kind: Service
    name: artemis
  port:
    targetPort: nodos
  tls:
    termination: passthrough
