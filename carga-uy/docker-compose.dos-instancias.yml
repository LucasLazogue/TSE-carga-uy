# dos instancias del central detras de un balanceador sin afinidad, como el Route de OpenShift: cada pedido puede ir
# a cualquiera. sirve para probar que el backoffice no depende de la instancia que abrio cada pantalla.
# requiere CARGAUY_CLAVE_VISTAS en el .env (ver docs/infraestructura.md#varias-instancias-y-autoescalado)
#
#   docker compose -f docker-compose.yml -f docker-compose.dos-instancias.yml up -d --build \
#     postgres mongo artemis ldap carga-uy carga-uy-2 balanceador
#
# backoffice en http://localhost:8088/carga-uy/login.xhtml; el encabezado X-Instancia de cada respuesta dice que
# instancia la atendio
services:
  carga-uy:
    image: carga-uy-central

  carga-uy-2:
    extends:
      file: docker-compose.yml
      service: carga-uy
    image: carga-uy-central
    hostname: carga-uy-2
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=carga-uy-2
    ports: !override
      - "8090:8080"
    depends_on:
      - mongo
      - artemis
      - ldap

  balanceador:
    image: nginx:1.29-alpine
    ports:
      - "8088:80"
    configs:
      - source: balanceador
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - carga-uy
      - carga-uy-2

configs:
  balanceador:
    content: |
      # reparte los pedidos entre las dos instancias, sin afinidad; si una no responde, el pedido va a la otra
      upstream central {
        server carga-uy:8080 max_fails=0;
        server carga-uy-2:8080 max_fails=0;
      }
      server {
        listen 80;
        location / {
          proxy_pass http://central;
          proxy_set_header Host $$http_host;
          # una instancia apagada no tiene IP y la conexion no se rechaza: sin esto, el pedido espera un minuto
          proxy_connect_timeout 2s;
          proxy_next_upstream error timeout;
          add_header X-Instancia $$upstream_addr always;
        }
      }
